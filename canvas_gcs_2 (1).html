<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDrone GCS - 2단계 Canvas 조이스틱 (키보드 지원)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b1329;
            user-select: none;
            touch-action: none;
        }
        /* 미래지향적 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- 헤더 영역 -->
    <header class="w-full max-w-xl flex justify-between items-center mb-4 bg-slate-900/80 p-4 rounded-2xl border border-slate-800/80 backdrop-blur-md">
        <div>
            <h1 class="text-lg font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
                AIDRONE COCKPIT <span class="text-xs text-slate-400">Step 2 Joystick & Key</span>
            </h1>
            <p class="text-[10px] text-slate-500">Dual-Touch Joystick + Keyboard Controller (WASD)</p>
        </div>
        <div id="statusIndicator" class="px-3 py-1 rounded-full bg-red-600/30 text-red-400 border border-red-500/50 text-xs font-semibold animate-pulse">
            Disconnected
        </div>
    </header>

    <!-- 메인 대시보드 -->
    <main class="w-full max-w-xl space-y-4">
        
        <!-- 실시간 상태 정보 바 -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-xl text-center">
                <span class="text-xs text-slate-400 block mb-1">Battery</span>
                <span id="batteryDisplay" class="text-xl font-mono font-bold text-green-400">--%</span>
            </div>
            <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-xl text-center">
                <span class="text-xs text-slate-400 block mb-1">Target Alt</span>
                <span id="altDisplay" class="text-xl font-mono font-bold text-cyan-400">0 cm</span>
            </div>
            <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-xl text-center">
                <span class="text-xs text-slate-400 block mb-1">Heading (Yaw)</span>
                <span id="yawDisplay" class="text-xl font-mono font-bold text-purple-400">0°</span>
            </div>
        </div>

        <!-- 핵심 이착륙/안전 제어 버튼 -->
        <div class="grid grid-cols-3 gap-3">
            <button id="takeoffBtn" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 p-3.5 rounded-xl font-bold text-sm shadow-lg shadow-purple-500/10 active:scale-95 transition-transform">이륙 (70cm)</button>
            <button id="landBtn" class="bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 p-3.5 rounded-xl font-bold text-sm shadow-lg shadow-yellow-500/10 active:scale-95 transition-transform">착륙</button>
            <button id="emergencyBtn" class="bg-gradient-to-r from-rose-700 to-red-600 hover:from-rose-600 hover:to-red-500 p-3.5 rounded-xl font-bold text-sm shadow-lg shadow-red-500/15 active:scale-95 transition-transform">비상정지</button>
        </div>

        <!-- CANVAS 인터랙티브 조이스틱 HUD (반응형 정사각 영역) -->
        <div class="flex justify-center">
            <canvas id="joystickCanvas" width="500" height="280" class="bg-slate-950 rounded-2xl border border-slate-800 shadow-2xl w-full touch-none"></canvas>
        </div>

        <!-- 조종 안내 팁 정보 -->
        <div class="bg-slate-900/40 border border-slate-800/60 rounded-xl p-3 text-xs text-slate-400 space-y-1">
            <div class="font-bold text-slate-300">⌨️ PC 키보드 단축키 안내:</div>
            <div class="grid grid-cols-2 gap-1 font-mono">
                <div>• 이동: <span class="text-cyan-400">W, A, S, D</span> (전후좌우)</div>
                <div>• 고도 상승: <span class="text-purple-400">Space</span> (+10cm)</div>
                <div>• 고도 하강: <span class="text-purple-400">Backspace</span> (-10cm)</div>
                <div>• 미조작 시: 자동으로 안전 호버링 정지</div>
            </div>
        </div>

        <!-- 시리얼 연결 버튼 -->
        <button id="connectBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 py-3.5 rounded-xl font-bold text-base shadow-lg shadow-emerald-500/10 active:scale-[0.99] transition-all">
            드론 연결하기
        </button>
    </main>

    <!-- 시스템 로그 오버레이 -->
    <div class="w-full max-w-xl mt-4 bg-slate-900/80 border border-slate-800 rounded-xl p-3">
        <div class="text-[10px] text-slate-500 mb-1 font-bold tracking-wider uppercase">System Telemetry Log</div>
        <div id="logBox" class="text-[11px] font-mono text-slate-400 h-20 overflow-y-auto whitespace-pre-wrap">기록 대기 중...</div>
    </div>

    <script>
        // ===================================================================
        // 드론 통신 및 조종 상태 정의
        // ===================================================================
        let port, writer, reader;
        let isConnected = false;
        let sendTimer = null;

        // 조종 상태 구조체 (검증된 스펙 100% 동일 유지)
        let state = {
            speedX: 0,
            speedY: 0,
            yaw: 0,
            alt: 0,
            optionFlags: 0
        };

        const connectBtn = document.getElementById('connectBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const batteryDisplay = document.getElementById('batteryDisplay');
        const altDisplay = document.getElementById('altDisplay');
        const yawDisplay = document.getElementById('yawDisplay');
        const logBox = document.getElementById('logBox');

        function log(msg) {
            const t = new Date().toLocaleTimeString('ko-KR', { hour12: false });
            logBox.textContent += `\n[${t}] ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // ===================================================================
        // Web Serial API 패킷 전송 및 수신 루프
        // ===================================================================
        async function startCommunication() {
            state.optionFlags = 0; // 초기에 통신 동기화를 위한 옵션값 리셋

            sendTimer = setInterval(async () => {
                if (!isConnected || !writer) return;
                try {
                    const packet = buildPacket();
                    await writer.write(packet);
                } catch (e) {
                    console.error("전송 오류:", e);
                }
            }, 50);

            reader = port.readable.getReader();
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    processTelemetry(value);
                }
            } catch (e) {
                console.error(e);
                log('수신 실패: ' + e.message);
            } finally {
                try { reader.releaseLock(); } catch (e) {}
            }
        }

        // 20바이트 고정 명령 패킷 빌더 (안전장치 규격 적용)
        function buildPacket() {
            const buffer = new ArrayBuffer(20);
            const view = new DataView(buffer);

            // 헤더 고정 규정값
            view.setUint8(0, 0x26); 
            view.setUint8(1, 0xA8); 
            view.setUint8(2, 0x14);
            view.setUint8(3, 0xB1); // CMD
            view.setUint8(4, 0x14); // LEN

            // 데이터부 (Bytes 6-15)
            view.setInt16(6, state.speedX, true);
            view.setInt16(8, state.speedY, true);
            view.setInt16(10, state.yaw, true);
            view.setUint16(12, Math.max(0, state.alt), true); // 안전 보장: 음수 드론 추락 원인 차단
            view.setUint16(14, state.optionFlags, true);

            // 고정 상수 패딩
            view.setUint8(16, 0x64);
            view.setUint8(18, 0x64);

            // 체크섬 연산 (6~19바이트 합의 하위 8비트)
            let checksum = 0;
            for (let i = 6; i < 20; i++) {
                checksum += view.getUint8(i);
            }
            view.setUint8(5, checksum & 0xFF);

            return new Uint8Array(buffer);
        }

        // 텔레메트리 파싱 및 필터링
        let parseOffset = 0;
        let parseLen = 20;
        let headMatchCnt = 0;
        const HEAD = [0x26, 0xA8, 0x14, 0xA0];
        let parseBuf = new Uint8Array(100);
        let batteryHistory = [];

        function findHeader(ch) {
            let cmp = ch;
            if (headMatchCnt === 3) cmp = ch & 0xF0;
            if (cmp === HEAD[headMatchCnt]) headMatchCnt++;
            else headMatchCnt = 0;
            if (headMatchCnt === 4) {
                headMatchCnt = 0;
                parseOffset = 4;
                parseLen = 20;
                return true;
            }
            return false;
        }

        function processTelemetry(bytes) {
            for (const b of bytes) {
                if (findHeader(b)) {
                    // 헤더 정렬 통과
                } else if (parseOffset > 0) {
                    parseBuf[parseOffset] = b;
                    if (parseOffset === 4) parseLen = b;
                    parseOffset++;
                }
                if (parseOffset > 0 && parseOffset === parseLen) {
                    parseOffset = 0;
                    let sum = 0;
                    for (let i = 6; i < parseLen; i++) sum += parseBuf[i];
                    if ((sum & 0xFF) === parseBuf[5] && parseLen > 9) {
                        updateBattery(parseBuf[9]);
                    }
                }
            }
        }

        function updateBattery(raw) {
            batteryHistory.push(raw);
            if (batteryHistory.length > 5) batteryHistory.shift();
            const sorted = [...batteryHistory].sort((a, b) => a - b);
            const median = sorted[Math.floor(sorted.length / 2)];
            batteryDisplay.innerText = median + "%";
            batteryDisplay.className = "text-xl font-mono font-bold " +
                (median < 20 ? "text-red-500 animate-pulse" : median < 40 ? "text-yellow-400" : "text-emerald-400");
        }

        // ===================================================================
        // 이착륙 및 물리 안전 제어 장치
        // ===================================================================
        document.getElementById('takeoffBtn').onclick = () => {
            state.alt = 70;
            state.optionFlags = 0x2F;
            altDisplay.textContent = state.alt + " cm";
            log('이륙 명령 송신 (목표 고도: 70cm)');
        };
        document.getElementById('landBtn').onclick = () => {
            state.speedX = 0; state.speedY = 0;
            state.alt = 0;
            state.optionFlags = 0x2F;
            altDisplay.textContent = "0 cm";
            log('착륙 명령 송신');
        };
        document.getElementById('emergencyBtn').onclick = () => {
            state.speedX = 0; state.speedY = 0; state.alt = 0;
            state.optionFlags = 0x2F;
            altDisplay.textContent = "0 cm";
            log('비상 착륙 및 비상 제정지 신호 송신!');
        };

        // 시리얼 연결 트리거
        connectBtn.onclick = async () => {
            if (isConnected) {
                try {
                    if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
                    if (reader) { try { await reader.cancel(); } catch (e) {} }
                    if (writer) { try { writer.releaseLock(); } catch (e) {} }
                    if (port) await port.close();
                } catch (e) {}
                isConnected = false;
                writer = null; port = null;
                statusIndicator.innerText = "Disconnected";
                statusIndicator.className = "px-3 py-1 rounded-full bg-red-600/30 text-red-400 border border-red-500/50 text-xs font-semibold";
                log('무선 드론 통신 포트 연결이 정상 해제되었습니다.');
                return;
            }
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 19200 });
                writer = port.writable.getWriter();
                isConnected = true;
                statusIndicator.innerText = "Connected";
                statusIndicator.className = "px-3 py-1 rounded-full bg-emerald-600/30 text-emerald-400 border border-emerald-500/50 text-xs font-semibold";
                log('드론 무선 통신 동글에 연결되었습니다. (Baud: 19200bps)');
                startCommunication();
            } catch (e) {
                console.error("연결 실패", e);
                log('포트 연결 에러: ' + e.message);
            }
        };

        // ===================================================================
        // CANVAS 듀얼 멀티터치 조이스틱 구현부
        // ===================================================================
        const canvas = document.getElementById('joystickCanvas');
        const ctx = canvas.getContext('2d');

        // 모드 2 인터랙션 조이스틱 설계 규격
        const sticks = {
            left: {
                cx: 120,
                cy: 140,
                radius: 70,
                kx: 120, // 손잡이 현재 X
                ky: 140, // 손잡이 현재 Y
                touchId: null,
                label: "Throttle / Yaw"
            },
            right: {
                cx: 380,
                cy: 140,
                radius: 70,
                kx: 380, // 손잡이 현재 X
                ky: 140, // 손잡이 현재 Y
                touchId: null,
                label: "Pitch / Roll"
            }
        };

        // 캔버스 크기 대비 해상도 조절용 스케일 수치 계산 도우미
        function getCanvasPointerPos(e, touchIndex = 0) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY, identifier;
            if (e.touches) {
                const t = e.touches[touchIndex];
                clientX = t.clientX;
                clientY = t.clientY;
                identifier = t.identifier;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
                identifier = 'mouse';
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
                id: identifier
            };
        }

        // 포인터 활성화 이벤트 처리
        function handleStart(e) {
            e.preventDefault();
            const touches = e.touches ? e.touches : [e];
            
            for (let i = 0; i < touches.length; i++) {
                const pos = getCanvasPointerPos(e, i);
                
                // 좌측 조이스틱 범위 판정
                const distLeft = Math.hypot(pos.x - sticks.left.cx, pos.y - sticks.left.cy);
                if (distLeft < sticks.left.radius + 30 && sticks.left.touchId === null) {
                    sticks.left.touchId = pos.id;
                    updateStickPosition('left', pos.x, pos.y);
                    continue;
                }

                // 우측 조이스틱 범위 판정 (수정 완료: sticks.right.radius -> sticks.right.cx)
                const distRight = Math.hypot(pos.x - sticks.right.cx, pos.y - sticks.right.cy);
                if (distRight < sticks.right.radius + 30 && sticks.right.touchId === null) {
                    sticks.right.touchId = pos.id;
                    updateStickPosition('right', pos.x, pos.y);
                }
            }
        }

        function handleMove(e) {
            e.preventDefault();
            const touches = e.touches ? e.touches : [e];

            for (let i = 0; i < touches.length; i++) {
                const pos = getCanvasPointerPos(e, i);

                if (pos.id === sticks.left.touchId) {
                    updateStickPosition('left', pos.x, pos.y);
                }
                if (pos.id === sticks.right.touchId) {
                    updateStickPosition('right', pos.x, pos.y);
                }
            }
        }

        function handleEnd(e) {
            e.preventDefault();
            if (e.touches) {
                // 현재 살아있는 터치 ID 식별
                const activeIds = Array.from(e.touches).map(t => t.identifier);
                if (!activeIds.includes(sticks.left.touchId) && sticks.left.touchId !== null) {
                    resetStick('left');
                }
                if (!activeIds.includes(sticks.right.touchId) && sticks.right.touchId !== null) {
                    resetStick('right');
                }
            } else {
                // 마우스 해제 시 전부 해제
                resetStick('left');
                resetStick('right');
            }
        }

        // 조이스틱 드래그 범위 제한 계산 및 조종값 매핑
        function updateStickPosition(side, px, py) {
            const stick = sticks[side];
            const dx = px - stick.cx;
            const dy = py - stick.cy;
            const distance = Math.hypot(dx, dy);

            // 한계 경계 구속 처리 (Max r 크기)
            if (distance <= stick.radius) {
                stick.kx = px;
                stick.ky = py;
            } else {
                const angle = Math.atan2(dy, dx);
                stick.kx = stick.cx + Math.cos(angle) * stick.radius;
                stick.ky = stick.cy + Math.sin(angle) * stick.radius;
            }

            // 변위 비율 구하기 (-1.0 ~ 1.0)
            const rx = (stick.kx - stick.cx) / stick.radius;
            const ry = (stick.ky - stick.cy) / stick.radius;

            if (side === 'left') {
                // 좌측 조이스틱 상하(Throttle/Altitude) & 좌우(Yaw) 제어
                // 1) Yaw 비례 조정 (민감도 조율값 10)
                if (Math.abs(rx) > 0.15) {
                    let yawDelta = Math.round(rx * 8);
                    state.yaw += yawDelta;
                    if (state.yaw > 180) state.yaw -= 360;
                    if (state.yaw < -180) state.yaw += 360;
                    yawDisplay.textContent = state.yaw + "°";
                }
                // 2) 고도 조정 (상방 드래그 시 고도 상승, 하방 드래그 시 하강)
                if (Math.abs(ry) > 0.15) {
                    let altDelta = Math.round(-ry * 3); // 드론 안전을 위해 천천히 고도를 변환
                    state.alt = Math.max(0, Math.min(200, state.alt + altDelta));
                    state.optionFlags = 0x2F; // 고도 조정 플래그
                    altDisplay.textContent = state.alt + " cm";
                }
            } else {
                // 우측 조이스틱 Pitch / Roll 비례 제어 (이동은 optionFlags = 0x0F)
                // 최대 이동 속도는 원본 버튼과 일치하게 -50 ~ 50 바운더리 매핑
                state.speedX = Math.round(rx * 50);
                state.speedY = Math.round(-ry * 50); // Y축 반전 보정
                state.optionFlags = 0x0F;
            }
        }

        // 조작 해제 시 스프링 복귀 연출 및 안전 정지
        function resetStick(side) {
            const stick = sticks[side];
            stick.touchId = null;
            stick.kx = stick.cx;
            stick.ky = stick.cy;

            if (side === 'right') {
                // 안전을 위해 드론 제자리 호버링(STOP) 신호로 자동 복귀
                state.speedX = 0;
                state.speedY = 0;
                state.optionFlags = 0x0F;
            }
        }

        // 터치 및 포인터 호환 이벤트 등록
        canvas.addEventListener('pointerdown', handleStart);
        canvas.addEventListener('pointermove', handleMove);
        canvas.addEventListener('pointerup', handleEnd);
        canvas.addEventListener('pointercancel', handleEnd);
        canvas.addEventListener('pointerleave', handleEnd);

        // ===================================================================
        // PC 키보드 제어 이벤트 리스너 추가
        // ===================================================================
        const pressedKeys = new Set();

        function adjustAlt(delta) {
            state.alt = Math.max(0, Math.min(200, state.alt + delta));
            state.optionFlags = 0x2F; // 고도 제어 옵션 플래그
            altDisplay.textContent = state.alt + " cm";
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            // 키보드 조종용 타겟 키 체크
            if (['w', 'a', 's', 'd', ' ', 'backspace'].includes(key)) {
                e.preventDefault(); // 웹 브라우저 스크롤 및 뒤로가기 기본 동작 전면 방지
                pressedKeys.add(key);

                // 고도 변경 (Space: 상승 10, Backspace: 하강 10) - 꾹 눌렀을 때의 고정 속도 증가 방지를 위해 e.repeat 차단
                if (key === ' ' && !e.repeat) {
                    adjustAlt(10);
                    log('키보드 상승 명령 (+10cm)');
                }
                if (key === 'backspace' && !e.repeat) {
                    adjustAlt(-10);
                    log('키보드 하강 명령 (-10cm)');
                }

                updateKeyboardMovement();
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd', ' ', 'backspace'].includes(key)) {
                e.preventDefault();
                pressedKeys.delete(key);
                updateKeyboardMovement();
            }
        });

        // 활성화된 WASD 키 조합 계산 후 드론 속도 상태 업데이트
        function updateKeyboardMovement() {
            // 터치 조종 입력중일 때는 키보드 이동 무시
            if (sticks.right.touchId !== null) return;

            let targetSpeedX = 0;
            let targetSpeedY = 0;

            if (pressedKeys.has('w')) targetSpeedY += 50;  // 전진
            if (pressedKeys.has('s')) targetSpeedY -= 50;  // 후진
            if (pressedKeys.has('a')) targetSpeedX -= 50;  // 좌이동
            if (pressedKeys.has('d')) targetSpeedX += 50;  // 우이동

            state.speedX = targetSpeedX;
            state.speedY = targetSpeedY;
            state.optionFlags = 0x0F; // 이동 명령

            // 가상 조이스틱 핸들 노브 비주얼 싱크 연동
            const rx = targetSpeedX / 50;
            const ry = -targetSpeedY / 50; // Y축 화면 좌표계 반전 반영

            sticks.right.kx = sticks.right.cx + rx * sticks.right.radius;
            sticks.right.ky = sticks.right.cy + ry * sticks.right.radius;
        }

        // ===================================================================
        // HUD 비주얼 렌더링 프레임 루프 (60FPS 모니터 주사율 동기화)
        // ===================================================================
        function renderHUD() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 미래형 조종석 사선 격자 배경(Background Grid)
            ctx.strokeStyle = 'rgba(88, 28, 135, 0.4)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 25) {
                ctx.beginPath();
                ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 25) {
                ctx.beginPath();
                ctx.moveTo(0, j); ctx.lineTo(canvas.width, j);
                ctx.stroke();
            }

            // 2. 듀얼 조이스틱 베이스 그리기
            Object.keys(sticks).forEach(side => {
                const s = sticks[side];
                const isActive = s.touchId !== null || (side === 'right' && (state.speedX !== 0 || state.speedY !== 0));

                // 조이스틱 바깥 아웃라인 링
                ctx.save();
                ctx.shadowBlur = isActive ? 15 : 5;
                ctx.shadowColor = side === 'left' ? 'rgba(6, 182, 212, 0.5)' : 'rgba(168, 85, 247, 0.5)';
                
                ctx.strokeStyle = side === 'left' ? 'rgba(6, 182, 212, 0.3)' : 'rgba(168, 85, 247, 0.3)';
                if (isActive) {
                    ctx.strokeStyle = side === 'left' ? '#22d3ee' : '#c084fc';
                }
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(s.cx, s.cy, s.radius, 0, Math.PI * 2);
                ctx.stroke();

                // 가이드 눈금선 십자 크로스헤어
                ctx.restore();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(s.cx - s.radius, s.cy); ctx.lineTo(s.cx + s.radius, s.cy);
                ctx.moveTo(s.cx, s.cy - s.radius); ctx.lineTo(s.cx, s.cy + s.radius);
                ctx.stroke();

                // 조이스틱 노브(손잡이) 그리기
                ctx.save();
                ctx.shadowBlur = isActive ? 20 : 8;
                ctx.shadowColor = side === 'left' ? 'rgba(34, 211, 238, 0.6)' : 'rgba(192, 132, 252, 0.6)';

                let knobGradient = ctx.createRadialGradient(s.kx, s.ky, 2, s.kx, s.ky, 24);
                if (side === 'left') {
                    knobGradient.addColorStop(0, '#ffffff');
                    knobGradient.addColorStop(0.3, '#22d3ee');
                    knobGradient.addColorStop(1, '#0891b2');
                } else {
                    knobGradient.addColorStop(0, '#ffffff');
                    knobGradient.addColorStop(0.3, '#c084fc');
                    knobGradient.addColorStop(1, '#7e22ce');
                }

                ctx.beginPath();
                ctx.arc(s.kx, s.ky, 24, 0, Math.PI * 2);
                ctx.fillStyle = knobGradient;
                ctx.fill();
                ctx.restore();

                // 조이스틱 조종 레이블 텍스트 투영
                ctx.fillStyle = side === 'left' ? '#a5f3fc' : '#f3e8ff';
                ctx.font = 'bold 9px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(s.label, s.cx, s.cy - s.radius - 10);
            });

            // 3. 기체 조종 벡터 중앙 대시 패널 (Crosshair Display)
            const midX = canvas.width / 2;
            const midY = canvas.height / 2;

            // 실시간 방향타 벡터 인디케이터
            ctx.strokeStyle = 'rgba(244, 63, 94, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(midX, midY, 35, 0, Math.PI * 2);
            ctx.stroke();

            // 목표 고도 비례 스케일 기호 그리기
            let barLength = (state.alt / 200) * 30;
            ctx.fillStyle = 'rgba(34, 211, 238, 0.7)';
            ctx.fillRect(midX - 3, midY + 15 - barLength, 6, barLength);

            // 방향각 지시 나침반 인디케이터
            ctx.save();
            ctx.translate(midX, midY);
            ctx.rotate((state.yaw * Math.PI) / 180);
            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -22); // 북쪽(전면) 삼각형 지시계
            ctx.lineTo(-6, -12);
            ctx.lineTo(6, -12);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            // 실시간 상태 수치 실시간 텍스트 출력
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.font = '8px monospace';
            ctx.textAlign = 'center';
            ctx.fillText("ROLL/PITCH VEC", midX, midY - 45);
            ctx.fillStyle = '#f43f5e';
            ctx.fillText(`X:${state.speedX} Y:${state.speedY}`, midX, midY + 45);

            requestAnimationFrame(renderHUD);
        }

        // 페이지 초기 구동 시 HUD 렌더링 프레임 구동
        window.onload = function() {
            renderHUD();
        }
    </script>
</body>
</html>
